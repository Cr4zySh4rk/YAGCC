name: Build firmware & deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: 2.1.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/detect.test.mjs
      - run: node tests/firmware_version.test.mjs

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [pico_clone, pico, pico_w, pico2, pico2_w, waveshare_rp2040_zero, waveshare_rp2040_one, sparkfun_promicro, adafruit_kb2040]
    steps:
      - uses: actions/checkout@v4

      # No apt: the Ubuntu mirrors kept stalling the install for 20+ minutes. The Arm toolchain comes from
      # the GitHub Actions cache (downloaded from Arm once), ninja from PyPI, cmake is on the runner.
      - name: Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        timeout-minutes: 10
        with:
          release: '13.3.Rel1'

      # the runner's own Python (in its tool cache, nothing to download); system pip refuses --user on Ubuntu 24.04
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Build tools
        timeout-minutes: 5
        run: |
          for try in 1 2 3; do
            timeout 120 python -m pip install --quiet ninja pycryptodomex && break
            [ $try = 3 ] && exit 1; sleep 10
          done
          ninja --version; cmake --version | head -1; arm-none-eabi-gcc --version | head -1

      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pico-sdk
            ${{ runner.temp }}/btstack
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ hashFiles('firmware/CMakeLists.txt') }}
          restore-keys: pico-sdk-${{ env.PICO_SDK_VERSION }}-

      - name: Pico SDK
        timeout-minutes: 10
        run: |
          retry() { for try in 1 2 3; do timeout 300 "$@" && return 0; echo "retry $try: $*"; sleep 10; done; return 1; }
          if [ ! -f "$RUNNER_TEMP/pico-sdk/pico_sdk_init.cmake" ]; then
            rm -rf "$RUNNER_TEMP/pico-sdk"
            retry git clone -q --depth 1 -b ${PICO_SDK_VERSION} https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
            retry git -C "$RUNNER_TEMP/pico-sdk" submodule update -q --init --depth 1 lib/tinyusb lib/btstack lib/cyw43-driver lib/lwip
          fi
          # Bluetooth: Santroller's BTstack fork, at the commit firmware/CMakeLists.txt names (YACC_BTSTACK_COMMIT)
          BTSTACK_COMMIT=$(sed -n 's/^set(YACC_BTSTACK_COMMIT \([0-9a-f]*\))/\1/p' firmware/CMakeLists.txt)
          if [ "$(git -C "$RUNNER_TEMP/btstack" rev-parse HEAD 2>/dev/null)" != "$BTSTACK_COMMIT" ]; then
            rm -rf "$RUNNER_TEMP/btstack"; git init -q "$RUNNER_TEMP/btstack"
            retry git -C "$RUNNER_TEMP/btstack" fetch -q --depth 1 https://github.com/sanjay900/btstack "$BTSTACK_COMMIT"
            git -C "$RUNNER_TEMP/btstack" checkout -q FETCH_HEAD
          fi

      - name: Build
        timeout-minutes: 15
        run: |
          cmake -S firmware -B build -G Ninja -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DPICO_BTSTACK_PATH="$RUNNER_TEMP/btstack"
          cmake --build build

      - name: Collect
        run: |
          mkdir -p out
          cp build/yacc.uf2 out/yagcc-${{ matrix.board }}.uf2
          cp build/nuke/yacc_nuke.uf2 out/nuke-${{ matrix.board }}.uf2

      - name: Size
        run: arm-none-eabi-size build/yacc.elf | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: out/*.uf2

  deploy:
    needs: [test, firmware]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r web/* site/
          mkdir -p site/downloads
          cp artifacts/yagcc-*.uf2 site/downloads/
          cp artifacts/nuke-pico.uf2  site/downloads/yagcc-nuke-rp2040.uf2
          cp artifacts/nuke-pico2.uf2 site/downloads/yagcc-nuke-rp2350.uf2
          touch site/.nojekyll
          # cache-bust: every deploy gets new asset URLs, so browsers never mix old JS with new HTML
          find site -name '*.html' -o -name '*.js' | xargs sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g"
          # the page compares its own build (meta yagcc-build) with this file to offer a reload when it's stale
          echo "{\"build\":\"?v=${GITHUB_SHA::7}\"}" > site/version.json
          ls -la site/downloads

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages occasionally answers 500 "Failed to create deployment"; retry once instead of failing the run
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
